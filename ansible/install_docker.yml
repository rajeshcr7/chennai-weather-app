
---
- name: Install and configure Docker on EC2
  hosts: webservers
  become: true
  gather_facts: true

  tasks:
    - name: Install Docker
      ansible.builtin.dnf:
        name: docker
        state: present

    - name: Start Docker and enable it at boot
      ansible.builtin.systemd_service:
        name: docker
        state: started
        enabled: true

    - name: Verify Docker service is running
      ansible.builtin.command: systemctl is-active docker
      register: docker_status
      changed_when: false

    - name: Display Docker service status
      ansible.builtin.debug:
        msg: "Docker service status: {{ docker_status.stdout }}"

